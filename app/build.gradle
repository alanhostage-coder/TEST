plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abbeyhill.alan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abbeyhill.alan'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
