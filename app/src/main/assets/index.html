<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e8e2cf">
  <title>ALAN</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="machine">
    <header class="header">
      <section class="brand-panel">
        <div class="brand">ALAN</div>
        <div class="strap">SAMPLER / SEQUENCER</div>
        <div class="speaker" aria-hidden="true"></div>
      </section>

      <section class="lcd" aria-live="polite">
        <div class="lcd-meta">
          <div><span class="lcd-tag">BANK</span><strong id="bankDisplay">A 909</strong></div>
          <div><span class="lcd-tag">PAD</span><strong id="padDisplay">1 KIK</strong></div>
          <div><span class="lcd-tag">BPM</span><strong id="bpmDisplay">132</strong></div>
        </div>
        <div class="lcd-main">
          <div class="lcd-title-row">
            <span id="modeDisplay">READY</span>
            <span id="statusDisplay">EMPTY PATTERN</span>
          </div>
          <div class="lcd-grid" id="lcdGrid"></div>
        </div>
      </section>

      <section class="transport-top">
        <div class="tempo-dial">
          <button id="bpmDown" aria-label="Tempo down">−</button>
          <span>BPM</span>
          <button id="bpmUp" aria-label="Tempo up">+</button>
        </div>
        <button class="transport play" id="playBtn"><span>▶</span><small>PLAY</small></button>
        <button class="transport stop" id="stopBtn"><span>■</span><small>STOP</small></button>
        <button class="transport rec" id="recordBtn"><span>●</span><small>REC</small></button>
      </section>
    </header>

    <section class="workarea">
      <aside class="banks panel">
        <h2>BANK</h2>
        <div id="bankStrip" class="bank-list"></div>
      </aside>

      <section class="pads-panel panel">
        <div class="panel-head">
          <h2>PADS</h2>
          <span id="selectedDisplay">PAD 1 / KIK</span>
        </div>
        <div id="pads" class="pads"></div>
      </section>

      <section class="fx-panel panel">
        <h2>FX</h2>
        <div id="fxKeys" class="fx-list"></div>
      </section>

      <section class="sequence-panel panel">
        <div class="panel-head">
          <h2>SEQUENCE</h2>
          <span>DENSITY <strong id="densityValue">5</strong></span>
        </div>
        <button class="wide orange" id="randomBtn">RND <small>GENERATE / MUTATE</small></button>
        <button class="wide" id="clearBtn">CLR <small>CLEAR CURRENT BANK</small></button>
        <div class="density">
          <label for="density">DENS</label>
          <input id="density" type="range" min="1" max="9" value="5" step="1">
        </div>
        <div class="nudge">
          <button id="shiftLeft">◀</button>
          <span>NUDGE</span>
          <button id="shiftRight">▶</button>
        </div>
      </section>

      <section class="io-panel panel">
        <h2>SONG / SAMPLE</h2>
        <button class="wide dark" id="loadSongBtn">LOAD SONG</button>
        <button class="wide dark" id="saveSongBtn">SAVE SONG</button>
        <button class="wide dark" id="demosBtn">STARTERS</button>
        <div class="io-divider"></div>
        <button class="wide" id="loadSampleBtn">LOAD SMP</button>
        <button class="wide" id="recordPadBtn">REC PAD</button>
        <input id="songInput" type="file" accept=".alan,.json,application/json,text/plain" hidden>
        <input id="sampleInput" type="file" accept="audio/*" hidden>
      </section>
    </section>

    <footer class="foot">
      <span>ALAN 2.0</span>
      <span>MODERN BUILD / NO LEGACY LICENSING</span>
      <span id="footStatus">READY</span>
    </footer>
  </main>

  <dialog id="starterDialog">
    <div class="dialog-shell">
      <div class="dialog-head">
        <strong>STARTER SONGS</strong>
        <button id="closeStarters">×</button>
      </div>
      <div id="starterList" class="starter-list"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
