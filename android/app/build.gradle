plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proceeduntilapprehended.realm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.proceeduntilapprehended.realm'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
