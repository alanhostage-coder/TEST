name: Deploy Siloy Time to HubSpot Siloy UKI Apps
on:
  push:
    branches:
      - codex/siloy-time-enterprise
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_ACCOUNT_ID: '149783010'
      DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Siloy logo identity
        env:
          CORPUS_BRAND_URL: 'https://siloy.com/brand'
          CORPUS_BRAND_NAME: 'Siloy UKI'
        run: node scripts/configure-corpus-brand.mjs
      - name: Validate code and timesheet behaviour
        run: |
          node --check src/app/functions/SiloyTime.js
          node --test tests/*.test.js
      - name: Verify authorised HubSpot key
        run: |
          if [ -z "$DEFAULT_PERSONAL_ACCESS_KEY" ]; then
            echo "::error::Missing HUBSPOT_149783010_PERSONAL_ACCESS_KEY repository secret"
            exit 1
          fi
      - name: Bind Time object ID to this customer portal
        env:
          HUBSPOT_ACCOUNT_ID: '149783010'
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
        run: |
          set -euo pipefail
          npm install -g @hubspot/cli@8.18.0 --no-audit --no-fund >/dev/null 2>&1
          hs custom-object list-schemas --use-env --no-color > "$RUNNER_TEMP/suki-schemas.txt"
          object_id="$(grep -F 'siloy_time_entry' "$RUNNER_TEMP/suki-schemas.txt" | grep -oE '2-[0-9]+' | head -1)"
          if ! [[ "$object_id" =~ ^2-[0-9]+$ ]]; then
            echo "::error::Missing siloy_time_entry CRM schema. Run the SUKI suite storage bootstrap first."
            exit 1
          fi
          echo "Binding Time object type $object_id for SUKI 149783010"
          grep -rl '2-143515197' src/app | xargs -r sed -i "s/2-143515197/$object_id/g"
      - name: Upload isolated Siloy Time project
        id: upload
        uses: HubSpot/hubspot-project-actions/project-upload@v1.1.0
        with:
          project_dir: './'
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Deploy build when required
        if: steps.upload.outputs.deploy_id == ''
        uses: HubSpot/hubspot-project-actions/project-deploy@v1.1.0
        with:
          deploy_latest_build: true
          project_dir: './'
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Install Siloy Time after project registration
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: '149783010'
        run: |
          npm install -g @hubspot/cli@8.18.0
          echo "=== Build status ==="
          hs project list-builds --use-env --json
          for attempt in 1 2 3 4; do
            echo "=== Installation attempt $attempt ==="
            if printf 'y\n' | timeout 70s script -q -e -c "hs project install-app --use-env" /dev/null; then
              echo "Siloy Time installation accepted"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "HubSpot project registration may still be propagating"
              sleep 25
            fi
          done
          echo "::error::Siloy Time project deployed but install remains unavailable."
          exit 1
      - name: Verify installation status
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: '149783010'
        run: |
          hs project list-builds --use-env --json
          hs project app-install-status --use-env --json
