name: Generate EH15 From Geofabrik
on:
  push:
    branches: [ main ]
    paths:
      - 'tools/build_eh15_geofabrik.py'
      - '.github/workflows/generate-eh15-geofabrik.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eh15-map-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download current Scotland OSM extract
        run: |
          wget -q --show-progress https://download.geofabrik.de/europe/united-kingdom/scotland-latest.osm.pbf -O /tmp/scotland.osm.pbf
          test -s /tmp/scotland.osm.pbf
          osmium fileinfo /tmp/scotland.osm.pbf | head -40
          echo "OSM_SOURCE_TIMESTAMP=$(osmium fileinfo -g header.option.osmosis_replication_timestamp /tmp/scotland.osm.pbf || true)" >> "$GITHUB_ENV"
      - name: Clip EH15 coverage envelope
        run: |
          osmium extract -s complete_ways -b -3.1625,55.9268,-3.0660,55.9845 /tmp/scotland.osm.pbf -o /tmp/eh15.osm.pbf --overwrite
          osmium export /tmp/eh15.osm.pbf -f geojson -a type,id -o /tmp/eh15.geojson --overwrite
          test -s /tmp/eh15.geojson
          du -h /tmp/eh15.osm.pbf /tmp/eh15.geojson
      - name: Build tiled offline district
        env:
          EH15_GEOJSON: /tmp/eh15.geojson
        run: python3 tools/build_eh15_geofabrik.py
      - name: Verify inventory
        run: |
          python3 - <<'PY'
          import json,glob,sys
          m=json.load(open('eh15_full/manifest.json'))
          t=m['raw_tile_totals']
          assert len(m['tiles']) >= 25
          assert t['roads'] >= 300
          assert t['buildings'] >= 1500
          assert t.get('identity_features',0) >= 1
          assert m.get('identity_kind_totals',{}).get('coastline',0) >= 1
          assert m['destination_count'] >= 20
          assert len(glob.glob('eh15_full/tile_*.json')) == len(m['tiles'])
          print(json.dumps({'tiles':len(m['tiles']),'totals':t,'destinations':m['destination_count'],'source_timestamp':m['source_timestamp_utc']},indent=2))
          PY
          du -sh eh15_full
      - name: Commit bundled EH15 patch
        run: |
          cp -a eh15_full "$RUNNER_TEMP/eh15_full"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm -rf godot/patches/eh15_full
          mkdir -p godot/patches
          cp -a "$RUNNER_TEMP/eh15_full" godot/patches/eh15_full
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/patches/eh15_full
          git commit -m "Bundle full EH15 Android map"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: EH15-FULL-GEOFABRIK-PATCH
          path: eh15_full
          if-no-files-found: error
          retention-days: 30
