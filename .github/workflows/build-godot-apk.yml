name: Build PUA Godot APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot CI environment
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          set -o pipefail
          godot --headless --verbose --path godot --editor --quit 2>&1 | tee /tmp/pua-godot.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-godot.log

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          godot --headless --verbose --path godot --export-debug "Android" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_28.apk"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_28.apk"
          ls -lh "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_28.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.28-GREYBEARD-ANDROID
          path: build/android/PROCEED_UNTIL_APPREHENDED_0_28.apk
          if-no-files-found: error
          retention-days: 30
