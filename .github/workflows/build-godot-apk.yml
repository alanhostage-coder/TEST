name: Build PUA Godot APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

concurrency:
  group: pua-godot-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot CI environment
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. "$HOME/.config/godot/"; fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"; fi
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-godot.log 2>&1
          cat /tmp/pua-godot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-godot.log; then exit 1; fi
      - name: PUA headless soak gate
        run: |
          set +e
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-soak.log 2>&1
          status=$?
          set -e
          cat /tmp/pua-soak.log
          test "$status" -eq 0
          grep -q 'PUA_SOAK_OK' /tmp/pua-soak.log
      - name: Full EH15 mobile coverage gate
        run: |
          if [ -f godot/patches/eh15_full/manifest.json ]; then
            set +e
            timeout 40s godot --headless --path godot --script res://eh15_stream_test.gd > /tmp/eh15-stream.log 2>&1
            status=$?
            set -e
            cat /tmp/eh15-stream.log
            test "$status" -eq 0
            grep -q 'EH15_STREAM_OK' /tmp/eh15-stream.log
          else
            echo "EH15_STREAM_SKIP pre-harvest commit"
          fi
      - name: Mobile footprint road-safety regression
        run: |
          set +e
          timeout 30s godot --headless --path godot --script res://mobile_footprint_test.gd > /tmp/mobile-footprint.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-footprint.log
          test "$status" -eq 0
          grep -q 'MOBILE_FOOTPRINT_OK' /tmp/mobile-footprint.log
      - name: Mobile first-impression regression
        run: |
          set +e
          timeout 30s godot --headless --path godot --script res://mobile_first_impression_test.gd > /tmp/mobile-first.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-first.log
          test "$status" -eq 0
          grep -q 'MOBILE_FIRST_IMPRESSION_OK' /tmp/mobile-first.log
      - name: Mobile road-clearance regression
        run: |
          set +e
          timeout 30s godot --headless --path godot --script res://mobile_road_clearance_test.gd > /tmp/mobile-road-clearance.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-road-clearance.log
          test "$status" -eq 0
          grep -q 'MOBILE_ROAD_CLEARANCE_OK' /tmp/mobile-road-clearance.log
      - name: Forced mobile startup regression
        run: |
          set +e
          timeout 45s godot --headless --path godot --script res://mobile_startup_test.gd > /tmp/mobile-startup.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-startup.log
          test "$status" -eq 0
          grep -q 'MOBILE_STARTUP_OK' /tmp/mobile-startup.log
      - name: Portobello field facade regression
        run: |
          set +e
          timeout 45s godot --headless --path godot --script res://mobile_facade_test.gd > /tmp/mobile-facade.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-facade.log
          test "$status" -eq 0
          grep -q 'MOBILE_FACADE_OK' /tmp/mobile-facade.log
      - name: EH15 terrain data regression
        run: |
          set +e
          timeout 45s godot --headless --path godot --script res://mobile_terrain_test.gd > /tmp/mobile-terrain.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-terrain.log
          test "$status" -eq 0
          grep -q 'MOBILE_TERRAIN_OK' /tmp/mobile-terrain.log
      - name: Forced mobile terrain scene regression
        run: |
          set +e
          timeout 60s godot --headless --path godot --script res://mobile_terrain_scene_test.gd > /tmp/mobile-terrain-scene.log 2>&1
          status=$?
          set -e
          cat /tmp/mobile-terrain-scene.log
          test "$status" -eq 0
          grep -q 'MOBILE_TERRAIN_SCENE_OK' /tmp/mobile-terrain-scene.log
      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          godot --headless --verbose --path godot --export-debug "Android" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_90.apk"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_90.apk"
          ls -lh "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_90.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.90-ANDROID
          path: build/android/PROCEED_UNTIL_APPREHENDED_0_90.apk
          if-no-files-found: error
          retention-days: 30
