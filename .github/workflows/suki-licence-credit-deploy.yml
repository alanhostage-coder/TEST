name: Deploy Siloy Licence and Credit Heatmap
on:
  push:
    branches: [codex/suki-licence-credit-deploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        app: [licence, credit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUBSPOT_ACCOUNT_ID: '149783010'
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm target and credential
        run: test "$HUBSPOT_ACCOUNT_ID" = '149783010' && test -n "$HUBSPOT_PERSONAL_ACCESS_KEY"
      - name: Test read-only function
        run: |
          if [ "${{ matrix.app }}" = licence ]; then node --test suki-projects/licence/src/app/functions/RegisterRead.test.cjs; else node --test suki-projects/credit/tests/backend.test.js; fi
      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@8.19.0 --no-audit --no-fund
      - name: Validate project
        working-directory: suki-projects/${{ matrix.app }}
        run: hs project validate --use-env --no-color
      - name: Upload project
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: HubSpot/hubspot-project-actions/project-upload@v1.1.0
        with:
          project_dir: suki-projects/${{ matrix.app }}
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Deploy successful build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: HubSpot/hubspot-project-actions/project-deploy@v1.1.0
        with:
          project_dir: suki-projects/${{ matrix.app }}
          deploy_latest_build: true
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Check project deployment
        working-directory: suki-projects/${{ matrix.app }}
        run: |
          hs project info --use-env --json
          hs project list-builds --use-env --json
      - name: Install and check status
        working-directory: suki-projects/${{ matrix.app }}
        run: |
          printf 'y\n' | timeout 90s script -q -e -c 'hs project install-app --use-env' /dev/null
          hs project app-install-status --use-env --json
