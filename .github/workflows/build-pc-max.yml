name: Build PUA PC Max

on:
  workflow_dispatch:
  push:
    branches: [ main, experiment/gaussian-splat ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-pc-max.yml'

concurrency:
  group: pua-pc-max-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot and installer tooling
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. "$HOME/.config/godot/"; fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nsis zip xvfb xauth python3-pil
          godot --version
          makensis -VERSION
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-pcmax-parse.log 2>&1
          cat /tmp/pua-pcmax-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-pcmax-parse.log; then exit 1; fi

      - name: PUA runtime soak
        run: |
          set +e
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-pcmax-soak.log 2>&1
          status=$?
          set -e
          cat /tmp/pua-pcmax-soak.log
          test "$status" -eq 0
          grep -q 'PUA_SOAK_OK' /tmp/pua-pcmax-soak.log
          if grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-pcmax-soak.log; then exit 1; fi

      - name: Perceptual budget regression
        run: |
          timeout 30s godot --headless --path godot --script res://perceptual_budget_test.gd > /tmp/pua-perceptual-budget.log 2>&1
          cat /tmp/pua-perceptual-budget.log
          grep -q 'PUA_PERCEPTUAL_BUDGET_OK' /tmp/pua-perceptual-budget.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/pua-perceptual-budget.log; then exit 1; fi

      - name: Steering polish regression
        run: |
          timeout 30s godot --headless --path godot --script res://steering_polish_test.gd > /tmp/pua-steering-polish.log 2>&1
          cat /tmp/pua-steering-polish.log
          grep -q 'PUA_STEERING_POLISH_OK' /tmp/pua-steering-polish.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/pua-steering-polish.log; then exit 1; fi

      - name: Projector render proof
        id: projector_proof
        continue-on-error: true
        run: |
          mkdir -p build/projector-proof
          set +e
          timeout 30s xvfb-run -a godot --path godot --display-driver x11 --resolution 1920x1080 --script res://projector_render_proof.gd > /tmp/pua-projector-proof.log 2>&1
          status=$?
          set -e
          cat /tmp/pua-projector-proof.log
          cp /tmp/pua-projector-proof.log build/projector-proof/
          test "$status" -eq 0
          grep -q 'PUA_PROJECTOR_RENDER_OK' /tmp/pua-projector-proof.log
          test -s /tmp/pua-projector-proof.png
          python3 - <<'PY'
          from glob import glob
          from PIL import Image, ImageStat
          image = Image.open('/tmp/pua-projector-proof.png').convert('RGB')
          assert image.size == (1920, 1080), image.size
          assert max(ImageStat.Stat(image).stddev) > 3.0, 'projector proof is visually blank'
          panels = sorted(glob('/tmp/pua-projector-panel-*.png'))
          assert len(panels) == 5, panels
          for panel in panels:
              rendered = Image.open(panel).convert('RGB')
              assert rendered.width >= 112 and rendered.height >= 180, (panel, rendered.size)
              assert max(ImageStat.Stat(rendered).stddev) > 3.0, f'{panel} is visually blank'
          PY
          cp /tmp/pua-projector-proof.png build/projector-proof/
          cp /tmp/pua-projector-panel-*.png build/projector-proof/
          sha256sum build/projector-proof/pua-projector-proof.png > build/projector-proof/SHA256.txt

      - name: Upload projector render proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-PROJECTOR-RENDER-PROOF
          path: build/projector-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Stop on projector proof failure
        if: steps.projector_proof.outcome == 'failure' && steps.projector_proof.conclusion == 'failure'
        run: |
          echo "::error::Five-surface projector render proof failed; diagnostics uploaded."
          exit 1

      # CI dispatch marker: 2026-09-21 projector-proof rerun
      - name: PC Max invariants
        run: |
          grep -q 'name="Windows PC Max"' godot/export_presets.cfg
          grep -q 'custom_features="pc_max"' godot/export_presets.cfg
          grep -q 'PC_MAX_RENDER_SCALE' godot/bay_projection.gd
          grep -q 'pc_max_mode' godot/world.gd
          grep -q 'pc_max_mode' godot/open_world_director.gd
          grep -q 'map_road_segments' godot/world.gd
          grep -q 'const START_POSTCODE := "EH15 2BZ"' godot/map_stream.gd
          grep -q 'const MAX_SURFACES := 5' godot/bay_projection.gd

      - name: Export Windows PC Max
        run: |
          mkdir -p build/pcmax
          EXPORT_DIR="$(readlink -f build/pcmax)"
          godot --headless --verbose --path godot --export-release "Windows PC Max" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe"
          cd "$EXPORT_DIR"
          cat > PLAY_PUA_PC_MAX.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe --resolution 1920x1080
          EOF
          cat > PLAY_PUA_PC_MAX_FULLSCREEN.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe --resolution 1920x1080 --fullscreen
          EOF
          cat > README-PC-MAX.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.76 - PC MAX

          Tuned for a modern Windows laptop/desktop with a discrete or capable integrated GPU.
          Recommended: PLAY_PUA_PC_MAX.cmd for a 1920x1080 window.
          Fullscreen: PLAY_PUA_PC_MAX_FULLSCREEN.cmd.

          PC Max loads the source-dated EH15 2BZ OpenStreetMap patch immediately, then
          refreshes it when online. Building heights and road widths identify estimates.
          CAL supports five separate surfaces or the optional three-bay-only layout.
          The five-surface defaults are an unmeasured starting layout; align every corner
          and yaw to the closed shutters before judging the physical projection.
          The OSM panel names the nearest mapped road and source date; M toggles it.
          F6 cycles WEATHER through live / clear / rain / fog.

          Controller:
          Left stick = steer
          Right stick = look
          RT = accelerate
          LT = brake/reverse
          X = handbrake
          Y / right shoulder = Bay Window view toggle
          EOF
          sha256sum PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe > SHA256-PC-MAX.txt
          zip -9 PUA-0.76-PC-MAX-PORTABLE.zip PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe PLAY_PUA_PC_MAX.cmd PLAY_PUA_PC_MAX_FULLSCREEN.cmd README-PC-MAX.txt SHA256-PC-MAX.txt

      - name: Build Windows installer
        run: |
          cd build/pcmax
          cat > installer.nsi <<'EOF'
          Unicode True
          !include "MUI2.nsh"

          Name "PROCEED UNTIL APPREHENDED 0.76 PC MAX"
          OutFile "PUA-0.76-PC-MAX-LATEST-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\ProceedUntilApprehended"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe"
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Game" SecGame
            SetOutPath "$INSTDIR"
            File "PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe"
            File "README-PC-MAX.txt"
            File "SHA256-PC-MAX.txt"

            CreateDirectory "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            CreateShortCut "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe" "--resolution 1920x1080"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe" "--resolution 1920x1080"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX Fullscreen.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe" "--resolution 1920x1080 --fullscreen"

            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "DisplayName" "PROCEED UNTIL APPREHENDED 0.76 PC MAX"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "DisplayVersion" "0.76"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "Publisher" "Abbey Hill"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX Fullscreen.lnk"
            RMDir "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            Delete "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_PC_MAX.exe"
            Delete "$INSTDIR\README-PC-MAX.txt"
            Delete "$INSTDIR\SHA256-PC-MAX.txt"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax"
          SectionEnd
          EOF
          makensis installer.nsi
          test -s PUA-0.76-PC-MAX-LATEST-Setup.exe
          sha256sum PUA-0.76-PC-MAX-LATEST-Setup.exe > SHA256-INSTALLER.txt
          ls -lh PUA-0.76-PC-MAX-LATEST-Setup.exe PUA-0.76-PC-MAX-PORTABLE.zip

      - name: Upload PC Max installer
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-PC-MAX-INSTALLER
          path: |
            build/pcmax/PUA-0.76-PC-MAX-LATEST-Setup.exe
            build/pcmax/SHA256-INSTALLER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload PC Max portable
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-PC-MAX-PORTABLE
          path: build/pcmax/PUA-0.76-PC-MAX-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
