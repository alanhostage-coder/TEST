name: Build PUA XPS 15 9530

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-pc-max.yml'

concurrency:
  group: pua-xps9530-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot and installer tooling
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. "$HOME/.config/godot/"; fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nsis zip xvfb xauth python3-pil libfontconfig1 libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon-x11-0 libgl1 libegl1
          godot --version
          makensis -VERSION
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-pcmax-parse.log 2>&1
          cat /tmp/pua-pcmax-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-pcmax-parse.log; then exit 1; fi

      - name: PUA runtime soak
        run: |
          set +e
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-pcmax-soak.log 2>&1
          status=$?
          set -e
          cat /tmp/pua-pcmax-soak.log
          test "$status" -eq 0
          grep -q 'PUA_SOAK_OK' /tmp/pua-pcmax-soak.log
          if grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-pcmax-soak.log; then exit 1; fi

      - name: Five-surface render proof
        id: projector_proof
        run: |
          mkdir -p build/projector-proof
          set +e
          timeout 75s xvfb-run -a godot --path godot --display-driver x11 --resolution 1920x1080 --script res://projector_render_proof.gd > /tmp/pua-projector-proof.log 2>&1
          status=$?
          set -e
          cat /tmp/pua-projector-proof.log
          cp /tmp/pua-projector-proof.log build/projector-proof/
          test "$status" -eq 0
          grep -q 'PUA_PROJECTOR_RENDER_OK' /tmp/pua-projector-proof.log
          grep -q 'map_source=' /tmp/pua-projector-proof.log
          test -s /tmp/pua-projector-proof.png
          test -s /tmp/pua-projector-continuity.png
          test -s /tmp/pua-projector-calibration.png
          test -s /tmp/pua-xps-laptop-max-hd.png
          test -s /tmp/pua-driveabout/pitville-street.png
          test -s /tmp/pua-driveabout/hugh-dewar-fountain.png
          test -s /tmp/pua-driveabout/bellfield-community-hub.png
          test -s /tmp/pua-driveabout/st-marks-church.png
          test -s /tmp/pua-driveabout/twelve-triangles-high-street.png
          test -s /tmp/pua-projector-proof.json
          # Preserve the complete raster evidence even when a visual assertion
          # fails, so the next correction is based on pixels rather than logs.
          cp /tmp/pua-projector-proof.png build/projector-proof/
          cp /tmp/pua-projector-continuity.png build/projector-proof/
          cp /tmp/pua-projector-calibration.png build/projector-proof/
          cp /tmp/pua-xps-laptop-max-hd.png build/projector-proof/
          mkdir -p build/projector-proof/driveabout
          cp /tmp/pua-driveabout/*.png build/projector-proof/driveabout/
          cp /tmp/pua-projector-panel-*.png build/projector-proof/
          cp /tmp/pua-projector-proof.json build/projector-proof/
          python3 - <<'PY'
          import json
          from glob import glob
          from PIL import Image, ImageStat
          composite = Image.open('/tmp/pua-projector-proof.png').convert('RGB')
          assert composite.size == (1920, 1080), composite.size
          assert max(ImageStat.Stat(composite).stddev) > 3.0, 'composite is visually blank'
          continuity = Image.open('/tmp/pua-projector-continuity.png').convert('RGB')
          assert continuity.size == (1920, 1080), continuity.size
          assert max(ImageStat.Stat(continuity).stddev) > 3.0, 'continuity frame is visually blank'
          calibration = Image.open('/tmp/pua-projector-calibration.png').convert('RGB')
          assert calibration.size == (1920, 1080), calibration.size
          assert max(ImageStat.Stat(calibration).stddev) > 3.0, 'calibration frame is visually blank'
          guide_pixels = sum(
              1 for red, green, blue in calibration.getdata()
              if max(red, green, blue) > 180 and max(red, green, blue) - min(red, green, blue) > 65
          )
          assert guide_pixels > 2500, f'calibration fiducials are not visible enough: {guide_pixels}'
          laptop = Image.open('/tmp/pua-xps-laptop-max-hd.png').convert('RGB')
          assert laptop.size == (1920, 1080), laptop.size
          assert max(ImageStat.Stat(laptop).stddev) > 3.0, 'laptop max-hd frame is visually blank'
          for driveabout_path in sorted(Path('/tmp/pua-driveabout').glob('*.png')):
              drive = Image.open(driveabout_path).convert('RGB')
              assert drive.size == (1920, 1080), (driveabout_path, drive.size)
              assert max(ImageStat.Stat(drive).stddev) > 3.0, f'driveabout frame blank: {driveabout_path}'
          assert len(list(Path('/tmp/pua-driveabout').glob('*.png'))) == 5
          panels = sorted(glob('/tmp/pua-projector-panel-*.png'))
          assert len(panels) == 5, panels
          opening_marker_pixels = 0
          opening_marker_max_width = 0
          opening_marker_max_height = 0
          opening_marker_touches_edge = False
          opening_marker_bounds = []
          for panel in panels:
              rendered = Image.open(panel).convert('RGB')
              assert rendered.width >= 64 and rendered.height >= 180, (panel, rendered.size)
              assert max(ImageStat.Stat(rendered).stddev) > 3.0, f'{panel} is visually blank'
              marker_points = [
                  (index % rendered.width, index // rendered.width)
                  for index, (red, green, blue) in enumerate(rendered.getdata())
                  if red < 120 and green > 150 and blue > 175 and blue - red > 90
              ]
              opening_marker_pixels += len(marker_points)
              if marker_points:
                  marker_xs = [point[0] for point in marker_points]
                  marker_ys = [point[1] for point in marker_points]
                  opening_marker_bounds.append((panel, min(marker_xs), min(marker_ys), max(marker_xs), max(marker_ys)))
                  opening_marker_max_width = max(opening_marker_max_width, max(marker_xs) - min(marker_xs) + 1)
                  opening_marker_max_height = max(opening_marker_max_height, max(marker_ys) - min(marker_ys) + 1)
                  opening_marker_touches_edge |= min(marker_xs) <= 1 or max(marker_xs) >= rendered.width - 2
          assert opening_marker_pixels >= 12, f'opening anchor did not reach rendered pixels: {opening_marker_pixels}'
          assert opening_marker_pixels <= 2500, f'opening anchor became an oversized overlay: {opening_marker_pixels}'
          assert 60 <= opening_marker_max_width <= 175, f'opening anchor width is not projector-legible: {opening_marker_max_width}'
          assert opening_marker_max_height >= 4, f'opening anchor is too short to read: {opening_marker_max_height}'
          assert opening_marker_max_height <= 32, f'opening anchor became too tall for a restrained annotation: {opening_marker_max_height}'
          assert not opening_marker_touches_edge, f'opening anchor is clipped by a panel edge: {opening_marker_bounds}'
          with open('/tmp/pua-projector-proof.json', encoding='utf-8') as handle:
              proof = json.load(handle)
          assert proof['proof_profile'] == 'deterministic-clear-five-surface-v1', proof
          assert proof['weather'] == 'manual clear', proof
          assert proof['roads'] > 0 and proof['buildings'] > 0, proof
          assert proof['exact_buildings'] == proof['buildings'], proof
          assert proof['generic_tenement_facades'] > 0, proof
          assert proof['generic_tenement_windows'] >= 24, proof
          assert proof['generic_tenement_doors'] >= 1, proof
          assert proof['generic_tenement_shopfronts'] >= 6, proof
          assert proof['generic_tenement_downpipes'] >= 20, proof
          assert proof['generic_tenement_recesses'] >= proof['generic_tenement_shopfronts'], proof
          assert proof['generic_tenement_chimneys'] >= 40, proof
          assert proof['generic_tenement_railings'] >= 10, proof
          assert proof['xps_light_grade'] == 'edinburgh-side-light-v1', proof
          assert proof['packaged_overlay_roads'] == proof['packaged_roads'], proof
          assert abs(proof['packaged_overlay_position'][0] - proof['packaged_overlay_expected_x']) <= 1, proof
          assert proof['packaged_overlay_marker_visible'] is True, proof
          assert proof['opening_policy'] == 'verified-first-impression-v1', proof
          assert proof['opening_anchor'], proof
          assert proof['opening_anchor_annotation'] == proof['opening_anchor'], proof
          assert proof['opening_anchor_annotation_source'] in ('poi', 'building', 'point'), proof
          assert proof['projector_1024_aspect_error'] < 0.01, proof
          assert proof['legacy_yaw_normalised'] is True, proof
          assert proof['calibration_guide_proof'] is True, proof
          assert proof['calibration_guide_divisions'] == 4, proof
          assert proof['xps_profile_exercised'] is True, proof
          assert proof['laptop_max_hd_size'] == [1920, 1080], proof
          assert proof['xps_visual_density_policy'] == 'mapped-detail-priority-v1', proof
          assert 0.95 <= proof['xps_pixel_budget_ratio'] <= 1.02, proof
          scales = proof['xps_panel_render_scales']
          assert len(scales) == 5, scales
          assert scales[1] > 0.86, scales
          assert scales[3] < 0.86 and scales[4] < 0.86, scales
          PY
          cp /tmp/pua-projector-proof.png build/projector-proof/
          cp /tmp/pua-projector-continuity.png build/projector-proof/
          cp /tmp/pua-projector-calibration.png build/projector-proof/
          cp /tmp/pua-xps-laptop-max-hd.png build/projector-proof/
          cp /tmp/pua-projector-panel-*.png build/projector-proof/
          cp /tmp/pua-projector-proof.json build/projector-proof/
          sha256sum build/projector-proof/*.png > build/projector-proof/SHA256.txt

      - name: Upload five-surface render proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-FIVE-SURFACE-RENDER-PROOF
          path: build/projector-proof/
          if-no-files-found: error
          retention-days: 30

      - name: XPS 9530 invariants
        run: |
          grep -q 'name="Windows XPS 9530 Projector"' godot/export_presets.cfg
          grep -q 'custom_features="pc_max,projector_max,xps_9530"' godot/export_presets.cfg
          grep -q 'XPS_9530_SURFACE_RENDER_SCALES' godot/bay_projection.gd
          grep -q 'xps_9530_mode' godot/world.gd
          grep -q 'street_edge_limit := 420 if xps_9530_mode' godot/world.gd
          grep -q 'micro_budget := 650 if xps_9530_mode' godot/world.gd
          grep -q 'facade_radius := 175.0 if xps_9530_mode' godot/world.gd
          grep -q 'pc_max_mode' godot/open_world_director.gd
          grep -q 'map_road_segments' godot/world.gd
          grep -q 'const START_POSTCODE := "EH15 2BZ"' godot/map_stream.gd
          grep -q 'const MAX_SURFACES := 5' godot/bay_projection.gd

      - name: Export Windows XPS 9530 projector
        run: |
          mkdir -p build/pcmax
          EXPORT_DIR="$(readlink -f build/pcmax)"
          godot --headless --verbose --path godot --export-release "Windows XPS 9530 Projector" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
          cd "$EXPORT_DIR"
          cat > PLAY_PUA_XPS9530.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "GAME=%~dp0PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
          rem Windows 11 per-app preference: use the high-performance adapter on this dual-GPU XPS.
          reg add "HKCU\Software\Microsoft\DirectX\UserGpuPreferences" /v "%GAME%" /t REG_SZ /d "GpuPreference=2;" /f >nul 2>&1
          "%GAME%" --resolution 1920x1080 --fullscreen
          EOF
          cat > PLAY_PUA_XPS9530_WINDOWED.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          set "GAME=%~dp0PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
          reg add "HKCU\Software\Microsoft\DirectX\UserGpuPreferences" /v "%GAME%" /t REG_SZ /d "GpuPreference=2;" /f >nul 2>&1
          "%GAME%" --resolution 1920x1080
          EOF
          cat > README-XPS9530.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.76 - XPS 15 9530 PROJECTOR

          Reference machine:
          Dell XPS 15 9530
          Intel Core i7-13620H
          16 GB RAM
          Windows 11 Pro
          Multiple GPUs installed; Windows reports a 4 GB graphics adapter.

          This is the active five-surface build. It boots directly into the projector
          driver view and keeps the full PC map geometry. The centre pane receives a
          larger render share while the two far wall panes use less, keeping the total
          five-view pixel budget effectively flat while sharpening the road ahead.
          Secondary trim/furniture does
          not cast shadows because five cameras multiply that cost while the seated
          driver gets almost no useful information from those shadows.

          PLAY_PUA_XPS9530.cmd is the normal fullscreen launch.
          PLAY_PUA_XPS9530_WINDOWED.cmd is the diagnostic fallback.
          Both launchers ask Windows 11 to prefer the high-performance GPU for this exe.

          The bundled EH15 2BZ OpenStreetMap patch is source-dated and works offline.
          Building footprints are mapped geometry. Unmapped heights and road widths are
          labelled estimates, not surveyed dimensions. Five-surface calibration remains
          user-measured: align corners to the closed shutters and save before judging fit.

          Controller:
          Left stick = steer
          Right stick = look
          RT = accelerate
          LT = brake/reverse
          X = handbrake
          Y / right shoulder = Bay Window view toggle
          F6 = weather mode
          EOF
          sha256sum PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe > SHA256-XPS9530.txt
          zip -9 PUA-0.76-XPS9530-PORTABLE.zip PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe PLAY_PUA_XPS9530.cmd PLAY_PUA_XPS9530_WINDOWED.cmd README-XPS9530.txt SHA256-XPS9530.txt

      - name: Build Windows installer
        run: |
          cd build/pcmax
          cat > installer.nsi <<'EOF'
          Unicode True
          !include "MUI2.nsh"

          Name "PROCEED UNTIL APPREHENDED 0.76 XPS 15 9530"
          OutFile "PUA-0.76-XPS9530-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\ProceedUntilApprehended"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Game" SecGame
            SetOutPath "$INSTDIR"
            File "PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
            File "README-XPS9530.txt"
            File "SHA256-XPS9530.txt"
            WriteRegStr HKCU "Software\Microsoft\DirectX\UserGpuPreferences" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe" "GpuPreference=2;"

            CreateDirectory "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            CreateShortCut "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe" "--resolution 1920x1080 --fullscreen"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA XPS 9530.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe" "--resolution 1920x1080 --fullscreen"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA XPS 9530 Windowed.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe" "--resolution 1920x1080"

            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "DisplayName" "PROCEED UNTIL APPREHENDED 0.76 XPS 15 9530"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "DisplayVersion" "0.76"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "Publisher" "Abbey Hill"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA XPS 9530.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA XPS 9530 Windowed.lnk"
            RMDir "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            DeleteRegValue HKCU "Software\Microsoft\DirectX\UserGpuPreferences" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
            Delete "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_76_XPS9530.exe"
            Delete "$INSTDIR\README-XPS9530.txt"
            Delete "$INSTDIR\SHA256-XPS9530.txt"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAXPS9530"
          SectionEnd
          EOF
          makensis installer.nsi
          test -s PUA-0.76-XPS9530-Setup.exe
          sha256sum PUA-0.76-XPS9530-Setup.exe > SHA256-INSTALLER.txt
          ls -lh PUA-0.76-XPS9530-Setup.exe PUA-0.76-XPS9530-PORTABLE.zip

      - name: Upload PC Max installer
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-XPS9530-INSTALLER
          path: |
            build/pcmax/PUA-0.76-XPS9530-Setup.exe
            build/pcmax/SHA256-INSTALLER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload PC Max portable
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.76-XPS9530-PORTABLE
          path: build/pcmax/PUA-0.76-XPS9530-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
