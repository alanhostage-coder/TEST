name: Build PUA PC Max

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-pc-max.yml'

concurrency:
  group: pua-pc-max-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot and installer tooling
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. "$HOME/.config/godot/"; fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nsis zip
          godot --version
          makensis -VERSION
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-pcmax-parse.log 2>&1
          cat /tmp/pua-pcmax-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-pcmax-parse.log; then exit 1; fi

      - name: PUA runtime soak
        run: |
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-pcmax-soak.log 2>&1
          cat /tmp/pua-pcmax-soak.log
          grep -q 'PUA_SOAK_OK' /tmp/pua-pcmax-soak.log
          if grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-pcmax-soak.log; then exit 1; fi

      - name: PC Max invariants
        run: |
          grep -q 'name="Windows PC Max"' godot/export_presets.cfg
          grep -q 'custom_features="pc_max"' godot/export_presets.cfg
          grep -q 'PC_MAX_RENDER_SCALE' godot/bay_projection.gd
          grep -q 'pc_max_mode' godot/world.gd
          grep -q 'pc_max_mode' godot/open_world_director.gd
          grep -q 'map_road_segments' godot/world.gd
          grep -q 'const START_POSTCODE := "EH15 2BZ"' godot/map_stream.gd
          grep -q 'const MAX_SURFACES := 5' godot/bay_projection.gd

      - name: Export Windows PC Max
        run: |
          mkdir -p build/pcmax
          EXPORT_DIR="$(readlink -f build/pcmax)"
          godot --headless --verbose --path godot --export-release "Windows PC Max" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe"
          cd "$EXPORT_DIR"
          cat > PLAY_PUA_PC_MAX.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe --resolution 1920x1080
          EOF
          cat > PLAY_PUA_PC_MAX_FULLSCREEN.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe --resolution 1920x1080 --fullscreen
          EOF
          cat > README-PC-MAX.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.75 - PC MAX

          Tuned for a modern Windows laptop/desktop with a discrete or capable integrated GPU.
          Recommended: PLAY_PUA_PC_MAX.cmd for a 1920x1080 window.
          Fullscreen: PLAY_PUA_PC_MAX_FULLSCREEN.cmd.

          PC Max loads the source-dated EH15 2BZ OpenStreetMap patch immediately, then
          refreshes it when online. Building heights and road widths identify estimates.
          CAL supports five separate surfaces or the optional three-bay-only layout.
          The five-surface defaults are an unmeasured starting layout; align every corner
          and yaw to the closed shutters before judging the physical projection.
          The OSM panel names the nearest mapped road and source date; M toggles it.
          F6 cycles WEATHER through live / clear / rain / fog.

          Controller:
          Left stick = steer
          Right stick = look
          RT = accelerate
          LT = brake/reverse
          X = handbrake
          Y / right shoulder = Bay Window view toggle
          EOF
          sha256sum PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe > SHA256-PC-MAX.txt
          zip -9 PUA-0.75-PC-MAX-PORTABLE.zip PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe PLAY_PUA_PC_MAX.cmd PLAY_PUA_PC_MAX_FULLSCREEN.cmd README-PC-MAX.txt SHA256-PC-MAX.txt

      - name: Build Windows installer
        run: |
          cd build/pcmax
          cat > installer.nsi <<'EOF'
          Unicode True
          !include "MUI2.nsh"

          Name "PROCEED UNTIL APPREHENDED 0.75 PC MAX"
          OutFile "PUA-0.75-PC-MAX-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\ProceedUntilApprehended"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe"
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Game" SecGame
            SetOutPath "$INSTDIR"
            File "PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe"
            File "README-PC-MAX.txt"
            File "SHA256-PC-MAX.txt"

            CreateDirectory "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            CreateShortCut "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe" "--resolution 1920x1080"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe" "--resolution 1920x1080"
            CreateShortCut "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX Fullscreen.lnk" "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe" "--resolution 1920x1080 --fullscreen"

            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "DisplayName" "PROCEED UNTIL APPREHENDED 0.75 PC MAX"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "DisplayVersion" "0.75"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "Publisher" "Abbey Hill"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\PROCEED UNTIL APPREHENDED.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX.lnk"
            Delete "$SMPROGRAMS\PROCEED UNTIL APPREHENDED\Play PUA PC MAX Fullscreen.lnk"
            RMDir "$SMPROGRAMS\PROCEED UNTIL APPREHENDED"
            Delete "$INSTDIR\PROCEED_UNTIL_APPREHENDED_0_75_PC_MAX.exe"
            Delete "$INSTDIR\README-PC-MAX.txt"
            Delete "$INSTDIR\SHA256-PC-MAX.txt"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PUAPCMax"
          SectionEnd
          EOF
          makensis installer.nsi
          test -s PUA-0.75-PC-MAX-Setup.exe
          sha256sum PUA-0.75-PC-MAX-Setup.exe > SHA256-INSTALLER.txt
          ls -lh PUA-0.75-PC-MAX-Setup.exe PUA-0.75-PC-MAX-PORTABLE.zip

      - name: Upload PC Max installer
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.75-PC-MAX-INSTALLER
          path: |
            build/pcmax/PUA-0.75-PC-MAX-Setup.exe
            build/pcmax/SHA256-INSTALLER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload PC Max portable
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.75-PC-MAX-PORTABLE
          path: build/pcmax/PUA-0.75-PC-MAX-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
