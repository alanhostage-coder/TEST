name: Validate PUA Godot
on:
  push:
    branches: [ main ]
    paths: [ 'godot/**', 'tools/build_osm_patch.py', 'tools/validate_location_patch.py', '.github/workflows/validate-godot.yml' ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Headless import and parse
        run: |
          set -o pipefail
          godot --headless --path godot --editor --quit 2>&1 | tee /tmp/godot-editor.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-editor.log
          godot --headless --path godot --quit-after 2 2>&1 | tee /tmp/godot-run.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-run.log
      - name: PUA API runtime soak
        run: |
          set -o pipefail
          timeout 20s godot --headless --path godot res://pua_soak_test.tscn 2>&1 | tee /tmp/pua-soak.log
          grep -q 'PUA_SOAK_OK' /tmp/pua-soak.log
          ! grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-soak.log
          timeout 20s godot --headless --path godot --script res://projection_test.gd 2>&1 | tee /tmp/pua-projection.log
          grep -q 'PUA_PROJECTION_WEATHER_OK' /tmp/pua-projection.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/pua-projection.log

      - name: Full EH15 mobile stream regression
        run: |
          if [ -f godot/patches/eh15_full/manifest.json ]; then
            set -o pipefail
            timeout 40s godot --headless --path godot --script res://eh15_stream_test.gd 2>&1 | tee /tmp/eh15-stream.log
            grep -q 'EH15_STREAM_OK' /tmp/eh15-stream.log
            ! grep -E 'SCRIPT ERROR|Parse Error|EH15_STREAM_FAIL' /tmp/eh15-stream.log
          else
            echo "EH15_STREAM_SKIP pre-harvest commit"
          fi

      - name: Mobile OSM footprint road-safety regression
        run: |
          set -o pipefail
          timeout 30s godot --headless --path godot --script res://mobile_footprint_test.gd 2>&1 | tee /tmp/mobile-footprint.log
          grep -q 'MOBILE_FOOTPRINT_OK' /tmp/mobile-footprint.log
          ! grep -E 'SCRIPT ERROR|Parse Error|MOBILE_FOOTPRINT_FAIL' /tmp/mobile-footprint.log

      - name: Greybeard invariants
        run: |
          grep -q 'renderer/rendering_method="mobile"' godot/project.godot
          grep -q 'move_and_slide' godot/car.gd
          grep -q '_build_cell' godot/world.gd
          grep -q 'PUA API 0.1' godot/pua_api.gd
          grep -q 'directive_changed' godot/world.gd
          grep -q 'OSMGroundTiles' godot/world.tscn
          grep -q 'tile.openstreetmap.org' godot/osm_ground_tiles.gd
          grep -q 'signal location_ready' godot/map_stream.gd
          grep -q '_on_location_ready' godot/osm_ground_tiles.gd
          grep -q 'for ring in range(radius + 1)' godot/osm_ground_tiles.gd
          grep -q 'window/handheld/orientation=0' godot/project.godot
          grep -q '_add_exact_osm_facade_detail' godot/world.gd
          grep -q 'pua_map_stream_eh15_2bz_v7' godot/map_stream.gd
          grep -q 'const START_POSTCODE := "EH15 2BZ"' godot/map_stream.gd
          grep -q 'const FALLBACK_LAT := 55.951507' godot/map_stream.gd
          grep -q 'const FALLBACK_LON := -3.107122' godot/map_stream.gd
          grep -q 'const MAX_SURFACES := 5' godot/bay_projection.gd
          grep -q 'set_weather_mode' godot/world_state.gd
          grep -q 'nearest_named_road' godot/map_stream.gd
          grep -q 'OS.has_feature("projector_max")' godot/osm_ground_tiles.gd
          mkdir -p build/location-patch
          python3 tools/validate_location_patch.py --json build/location-patch/EH15-2BZ-VALIDATION.json
          grep -q 'poi_features' godot/map_stream.gd
          grep -q '_add_mapped_road_name_signs' godot/world.gd
          grep -q '_add_named_poi_markers' godot/world.gd
          grep -q 'LOW_SPEC_EXACT_FOOTPRINT_RADIUS := 220.0' godot/world.gd
          grep -q '_build_live_map_overlay' godot/osm_ground_tiles.gd
          grep -q 'Windows PC Max' godot/export_presets.cfg
          grep -q 'custom_features="pc_max"' godot/export_presets.cfg

      - name: Package independent EH15 location patch
        run: |
          mkdir -p build/location-patch
          zip -j build/location-patch/PUA-EH15-2BZ-OSM-PATCH-2026-09-20.zip godot/patches/README.md godot/patches/eh15_2bz*.json build/location-patch/EH15-2BZ-VALIDATION.json
          sha256sum build/location-patch/PUA-EH15-2BZ-OSM-PATCH-2026-09-20.zip > build/location-patch/SHA256-EH15-PATCH.txt
          test -s build/location-patch/PUA-EH15-2BZ-OSM-PATCH-2026-09-20.zip

      - name: Upload independent EH15 location patch
        uses: actions/upload-artifact@v4
        with:
          name: PUA-EH15-2BZ-OSM-PATCH-2026-09-20
          path: |
            build/location-patch/PUA-EH15-2BZ-OSM-PATCH-2026-09-20.zip
            build/location-patch/SHA256-EH15-PATCH.txt
            build/location-patch/EH15-2BZ-VALIDATION.json
          if-no-files-found: error
          retention-days: 30
