name: Build PUA ThinkPad
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-thinkpad.yml'

concurrency:
  group: pua-thinkpad-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-thinkpad.log 2>&1
          cat /tmp/pua-thinkpad.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-thinkpad.log; then
            exit 1
          fi

      - name: PUA headless soak gate
        run: |
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-thinkpad-soak.log 2>&1
          cat /tmp/pua-thinkpad-soak.log
          grep -q 'PUA_SOAK_OK' /tmp/pua-thinkpad-soak.log
          ! grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-thinkpad-soak.log

      - name: Greybeard invariants
        run: |
          grep -q 'renderer/rendering_method="mobile"' godot/project.godot
          grep -q 'thinkpad_low' godot/export_presets.cfg
          grep -q 'projector_max' godot/export_presets.cfg
          grep -q 'move_and_slide' godot/car.gd
          grep -q 'map_road_segments' godot/world.gd
          grep -q 'const START_POSTCODE := "EH15 2BZ"' godot/map_stream.gd
          grep -q 'const MAX_SURFACES := 5' godot/bay_projection.gd

      - name: Export portable Windows x64
        run: |
          mkdir -p build/thinkpad
          EXPORT_DIR="$(readlink -f build/thinkpad)"
          godot --headless --verbose --path godot --export-release "Windows Desktop" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe"
          godot --headless --verbose --path godot --export-release "Windows Projector Max" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe"
          godot --headless --verbose --path godot --export-release "Windows PC Max" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe"
          ls -lh "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe"
          cd "$EXPORT_DIR"
          cat > PLAY_PUA_THINKPAD.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 960x540
          EOF
          cat > PLAY_PUA_POTATO.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 800x450
          EOF
          cat > PLAY_PUA_PROJECTOR_MAX.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1024x576
          EOF
          cat > PLAY_PUA_PROJECTOR_SAFE.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 800x450
          EOF
          cat > PLAY_PUA_PROJECTOR_FULLSCREEN.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --fullscreen
          EOF
          cat > README-THINKPAD.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.74 - THINKPAD LOW SPEC

          PLAY_PUA_THINKPAD.cmd = normal low-spec game.
          PLAY_PUA_POTATO.cmd = emergency 800x450 fallback.
          Source-dated EH15 2BZ OSM patch, five/three-surface calibration and controller support.
          EOF
          cat > README-PROJECTOR-MAX.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.74 - PROJECTOR MAX

          This build boots directly into the five-surface projector renderer.
          Start with PLAY_PUA_PROJECTOR_MAX.cmd.
          Use CAL to align three bay shutters plus two separate wall windows.
          LAYOUT switches to optional three-bay-only mode. Select a surface, adjust
          yaw, drag all four corners, and SAVE. Black gaps mask walls and frames.
          Use PLAY_PUA_PROJECTOR_SAFE.cmd if the old ThinkPad drops frames.
          Use PLAY_PUA_PROJECTOR_FULLSCREEN.cmd when the projector is the active display.

          The included EH15 2BZ OSM patch is source-dated and starts offline.
          The postcode centroid is not a surveyed window position. Unmapped building
          heights and road widths are explicitly estimates, not measured dimensions.
          It cuts distant decorative load, ambient vehicles, vapour and extra scene density
          so more of the old machine's budget goes into the five simultaneous views.
          F6 cycles WEATHER through live / clear / rain / fog.
          EOF
          cat > PLAY_PUA_PC_MAX.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe --fullscreen --resolution 1920x1080
          EOF
          cat > README-PC-MAX.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.74 - PC MAX

          Full-density Windows profile for the XPS-class machine.
          Does not enable thinkpad_low or projector_max.
          Use BAY WINDOW in-game, then LAYOUT to switch between five and three views.
          EOF
          sha256sum PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe > SHA256-THINKPAD.txt
          sha256sum PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe > SHA256-PROJECTOR-MAX.txt
          sha256sum PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe > SHA256-PC-MAX.txt
          zip -9 PUA-0.74-THINKPAD.zip PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe PLAY_PUA_THINKPAD.cmd PLAY_PUA_POTATO.cmd README-THINKPAD.txt SHA256-THINKPAD.txt
          zip -9 PUA-0.74-PROJECTOR-MAX.zip PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe PLAY_PUA_PROJECTOR_MAX.cmd PLAY_PUA_PROJECTOR_SAFE.cmd PLAY_PUA_PROJECTOR_FULLSCREEN.cmd README-PROJECTOR-MAX.txt SHA256-PROJECTOR-MAX.txt
          zip -9 PUA-0.74-PC-MAX.zip PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe PLAY_PUA_PC_MAX.cmd README-PC-MAX.txt SHA256-PC-MAX.txt

      - name: Upload portable ThinkPad build
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.74-THINKPAD
          path: |
            build/thinkpad/PROCEED_UNTIL_APPREHENDED_0_74_THINKPAD.exe
            build/thinkpad/PLAY_PUA_THINKPAD.cmd
            build/thinkpad/PLAY_PUA_POTATO.cmd
            build/thinkpad/README-THINKPAD.txt
            build/thinkpad/SHA256-THINKPAD.txt
            build/thinkpad/PUA-0.74-THINKPAD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Projector Max build
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.74-PROJECTOR-MAX
          path: |
            build/thinkpad/PROCEED_UNTIL_APPREHENDED_0_74_PROJECTOR_MAX.exe
            build/thinkpad/PLAY_PUA_PROJECTOR_MAX.cmd
            build/thinkpad/PLAY_PUA_PROJECTOR_SAFE.cmd
            build/thinkpad/PLAY_PUA_PROJECTOR_FULLSCREEN.cmd
            build/thinkpad/README-PROJECTOR-MAX.txt
            build/thinkpad/SHA256-PROJECTOR-MAX.txt
            build/thinkpad/PUA-0.74-PROJECTOR-MAX.zip
          if-no-files-found: error
          retention-days: 30


      - name: Upload PC Max build
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.74-PC-MAX
          path: |
            build/thinkpad/PROCEED_UNTIL_APPREHENDED_0_74_PC_MAX.exe
            build/thinkpad/PLAY_PUA_PC_MAX.cmd
            build/thinkpad/README-PC-MAX.txt
            build/thinkpad/SHA256-PC-MAX.txt
            build/thinkpad/PUA-0.74-PC-MAX.zip
          if-no-files-found: error
          retention-days: 30
