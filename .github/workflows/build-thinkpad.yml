name: Build PUA ThinkPad
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-thinkpad.yml'

concurrency:
  group: pua-thinkpad-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ -d /root/.local/share/godot/export_templates/4.5.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.5.1.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Strict project parse
        run: |
          godot --headless --verbose --path godot --editor --quit > /tmp/pua-thinkpad.log 2>&1
          cat /tmp/pua-thinkpad.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/pua-thinkpad.log; then
            exit 1
          fi

      - name: PUA headless soak gate
        run: |
          timeout 30s godot --headless --path godot res://pua_soak_test.tscn > /tmp/pua-thinkpad-soak.log 2>&1
          cat /tmp/pua-thinkpad-soak.log
          grep -q 'PUA_SOAK_OK' /tmp/pua-thinkpad-soak.log
          ! grep -E 'SCRIPT ERROR|Parse Error|PUA_SOAK_FAIL' /tmp/pua-thinkpad-soak.log

      - name: Greybeard invariants
        run: |
          grep -q 'renderer/rendering_method="mobile"' godot/project.godot
          grep -q 'thinkpad_low' godot/export_presets.cfg
          grep -q 'projector_max' godot/export_presets.cfg
          grep -q 'move_and_slide' godot/car.gd
          grep -q 'map_road_segments' godot/world.gd

      - name: Export portable Windows x64
        run: |
          mkdir -p build/thinkpad
          EXPORT_DIR="$(readlink -f build/thinkpad)"
          godot --headless --verbose --path godot --export-release "Windows Desktop" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe"
          godot --headless --verbose --path godot --export-release "Windows Projector Max" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe"
          test -s "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe"
          ls -lh "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe" "$EXPORT_DIR/PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe"
          cd "$EXPORT_DIR"
          cat > PLAY_PUA_THINKPAD.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 960x540
          EOF
          cat > PLAY_PUA_POTATO.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 800x450
          EOF
          cat > PLAY_PUA_PROJECTOR_MAX.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1024x576
          EOF
          cat > PLAY_PUA_PROJECTOR_SAFE.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 800x450
          EOF
          cat > PLAY_PUA_PROJECTOR_FULLSCREEN.cmd <<'EOF'
          @echo off
          cd /d "%~dp0"
          PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe --rendering-method gl_compatibility --rendering-driver opengl3 --fullscreen
          EOF
          cat > README-THINKPAD.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.66 - THINKPAD LOW SPEC

          PLAY_PUA_THINKPAD.cmd = normal low-spec game.
          PLAY_PUA_POTATO.cmd = emergency 800x450 fallback.
          RH15 2BZ map fidelity, Bay Window calibration and controller support remain.
          EOF
          cat > README-PROJECTOR-MAX.txt <<'EOF'
          PROCEED UNTIL APPREHENDED 0.66 - PROJECTOR MAX

          This build boots directly into the three-pane Bay Window cockpit renderer.
          Start with PLAY_PUA_PROJECTOR_MAX.cmd.
          Use CAL to align the three warped panes to the closed bay-window shutters.
          Use PLAY_PUA_PROJECTOR_SAFE.cmd if the old ThinkPad drops frames.
          Use PLAY_PUA_PROJECTOR_FULLSCREEN.cmd when the projector is the active display.

          Projector Max preserves the real RH15 2BZ roads, junctions and building geometry.
          It cuts distant decorative load, ambient vehicles, vapour and extra scene density
          so more of the old machine's budget goes into the three simultaneous window views.
          EOF
          sha256sum PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe > SHA256-THINKPAD.txt
          sha256sum PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe > SHA256-PROJECTOR-MAX.txt
          zip -9 PUA-0.66-THINKPAD.zip PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe PLAY_PUA_THINKPAD.cmd PLAY_PUA_POTATO.cmd README-THINKPAD.txt SHA256-THINKPAD.txt
          zip -9 PUA-0.66-PROJECTOR-MAX.zip PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe PLAY_PUA_PROJECTOR_MAX.cmd PLAY_PUA_PROJECTOR_SAFE.cmd PLAY_PUA_PROJECTOR_FULLSCREEN.cmd README-PROJECTOR-MAX.txt SHA256-PROJECTOR-MAX.txt

      - name: Upload portable ThinkPad build
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.66-THINKPAD
          path: |
            build/thinkpad/PROCEED_UNTIL_APPREHENDED_0_66_THINKPAD.exe
            build/thinkpad/PLAY_PUA_THINKPAD.cmd
            build/thinkpad/PLAY_PUA_POTATO.cmd
            build/thinkpad/README-THINKPAD.txt
            build/thinkpad/SHA256-THINKPAD.txt
            build/thinkpad/PUA-0.66-THINKPAD.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Projector Max build
        uses: actions/upload-artifact@v4
        with:
          name: PUA-0.66-PROJECTOR-MAX
          path: |
            build/thinkpad/PROCEED_UNTIL_APPREHENDED_0_66_PROJECTOR_MAX.exe
            build/thinkpad/PLAY_PUA_PROJECTOR_MAX.cmd
            build/thinkpad/PLAY_PUA_PROJECTOR_SAFE.cmd
            build/thinkpad/PLAY_PUA_PROJECTOR_FULLSCREEN.cmd
            build/thinkpad/README-PROJECTOR-MAX.txt
            build/thinkpad/SHA256-PROJECTOR-MAX.txt
            build/thinkpad/PUA-0.66-PROJECTOR-MAX.zip
          if-no-files-found: error
          retention-days: 30
