name: SUKI expand Notes and Time record associations
on:
  push:
    branches: [codex/suki-suite-installer]
    paths: [.github/workflows/suki-expand-associations.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  associations:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HUBSPOT_ACCOUNT_ID: '149783010'
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard deployment target
        run: |
          test "$HUBSPOT_ACCOUNT_ID" = '149783010'
          test -n "$HUBSPOT_PERSONAL_ACCESS_KEY"
      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@8.18.0 --no-audit --no-fund >/dev/null 2>&1
      - name: Expand custom-object association schemas
        run: |
          set -euo pipefail
          hs custom-object list-schemas --use-env --no-color > "$RUNNER_TEMP/schema-list.txt"
          for pair in "siloy_note:schemas/siloy-note.json" "siloy_time_entry:schemas/siloy-time.json"; do
            name="${pair%%:*}"
            file="${pair#*:}"
            type_id="$(grep -F "$name" "$RUNNER_TEMP/schema-list.txt" | grep -oE '2-[0-9]+' | head -1)"
            [[ "$type_id" =~ ^2-[0-9]+$ ]] || { echo "::error::Missing object $name"; exit 1; }
            echo "Updating existing schema $name ($type_id)"
            hs custom-object update-schema "$type_id" --path "$file" --use-env --no-color 2>&1 | tee "$RUNNER_TEMP/$name-update.txt"
            grep -q 'SUCCESS' "$RUNNER_TEMP/$name-update.txt" || { echo "::error::Schema update not confirmed for $name"; exit 1; }
            if grep -q 'ERROR' "$RUNNER_TEMP/$name-update.txt"; then exit 1; fi
          done
      - name: List resulting CRM object schemas
        run: |
          hs custom-object list-schemas --use-env --no-color
