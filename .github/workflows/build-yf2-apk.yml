name: Build YF2 APK
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'yf2-android/**'
      - '.github/workflows/build-yf2-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: yf2-android
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p out
          cp yf2-android/app/build/outputs/apk/debug/app-debug.apk out/YF2-0.1-debug.apk
          sha256sum out/YF2-0.1-debug.apk > out/YF2-0.1-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: YF2-APK
          path: out/*
          if-no-files-found: error
      - name: Fetch reverse-engineering tools
        run: |
          mkdir -p tools-out
          curl -L --fail --retry 3 -o tools-out/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          curl -L --fail --retry 3 -o tools-out/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sha256sum tools-out/* > tools-out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-RE-Tools
          path: tools-out/*
          if-no-files-found: error
