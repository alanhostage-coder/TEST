name: Build Pocket Lab APK

on:
  push:
    branches: [pocketlab-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct source ZIP
        run: |
          cat pocketlab_chunks/00.txt pocketlab_chunks/01.txt pocketlab_chunks/02.txt pocketlab_chunks/03.txt pocketlab_chunks/04.txt pocketlab_chunks/05.txt > pocketlab-source.b64
          base64 -d pocketlab-source.b64 > pocketlab-source.zip
          unzip -t pocketlab-source.zip
          unzip -q pocketlab-source.zip

      - name: Patch build for hosted runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('PocketLabAndroid-v0.5')
          root = project / 'build.gradle.kts'
          app = project / 'app/build.gradle.kts'
          main = project / 'app/src/main/java/dev/alan/pocketlab/MainActivity.kt'

          r = root.read_text()
          r = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n', '', r, flags=re.M)
          root.write_text(r)

          a = app.read_text()
          a = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\)\s*\n', '', a, flags=re.M)
          a = a.replace('compileSdk = 37', 'compileSdk = 36').replace('targetSdk = 37', 'targetSdk = 36')
          a = re.sub(r'\n\s*kotlinOptions\s*\{\s*\n\s*jvmTarget\s*=\s*"17"\s*\n\s*\}\s*\n', '\n', a)
          a = a.replace('androidx.compose:compose-bom:2026.09.00', 'androidx.compose:compose-bom:2025.05.01')
          a = a.replace('androidx.activity:activity-compose:1.12.3', 'androidx.activity:activity-compose:1.10.1')
          a = a.replace('androidx.core:core-ktx:1.17.0', 'androidx.core:core-ktx:1.16.0')
          a = a.replace('androidx.lifecycle:lifecycle-runtime-ktx:2.10.0', 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0')
          app.write_text(a)

          m = main.read_text()
          if 'import androidx.activity.compose.setContent' not in m:
              m = m.replace('import androidx.activity.ComponentActivity\n', 'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\n')
          main.write_text(m)
          PY

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: PocketLabAndroid-v0.5
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp PocketLabAndroid-v0.5/app/build/outputs/apk/debug/app-debug.apk PocketLab-v0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLab-v0.5-debug-apk
          path: PocketLab-v0.5-debug.apk
          if-no-files-found: error
