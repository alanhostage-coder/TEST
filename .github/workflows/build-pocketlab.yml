name: Build Pocket Lab APK

on:
  push:
    branches: [pocketlab-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract source
        run: unzip -q pocketlab-source.zip

      - name: Patch SDK level for hosted runner
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' PocketLabAndroid-v0.5/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' PocketLabAndroid-v0.5/app/build.gradle.kts

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: PocketLabAndroid-v0.5
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: cp PocketLabAndroid-v0.5/app/build/outputs/apk/debug/app-debug.apk PocketLab-v0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLab-v0.5-debug-apk
          path: PocketLab-v0.5-debug.apk
          if-no-files-found: error
