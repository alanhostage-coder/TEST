name: n333b
on:
  push:
    paths:
      - '.github/workflows/n333b.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: x
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip python3-pil fonts-dejavu-core >/dev/null
          S="$RUNNER_TEMP/s"; T="$RUNNER_TEMP/t"; O="$RUNNER_TEMP/o"; A="$RUNNER_TEMP/a"
          mkdir -p "$S" "$T" "$O" "$A"

          grab(){
            d="$1"; shift
            for u in "$@"; do
              rm -f "$d"
              if curl -fL --retry 1 --retry-delay 1 --connect-timeout 15 --max-time 45 -A 'Mozilla/5.0' "$u" -o "$d" && ffprobe -v error -show_entries format=duration -of csv=p=0 "$d" >/dev/null 2>&1; then return 0; fi
            done
            echo source-failed >&2; return 1
          }

          grab "$S/1.mp3" 'https://raw.githubusercontent.com/sujithmu/Portfolio/main/sounds/ms-teams-notification.mp3' 'https://www.myinstants.com/media/sounds/ms-teams-notification.mp3'
          grab "$S/2.mp3" 'https://www.ancta.com/wp-content/uploads/2023/01/teams.mp3' 'https://www.myinstants.com/media/sounds/microsoft-teams-ringtone.mp3'
          grab "$S/3.mp3" 'https://raw.githubusercontent.com/beadsland/bricodash/master/html/snd/slack_sfx/knock_brush.mp3'
          grab "$S/4.wav" 'https://raw.githubusercontent.com/Faris0520/windows-media/main/Windows%20Notify%20Email.wav'
          grab "$S/5.wav" 'https://raw.githubusercontent.com/Faris0520/windows-media/main/Windows%20Notify%20System%20Generic.wav'
          grab "$S/6.mp3" 'https://www.myinstants.com/media/sounds/iosrebound.mp3'
          grab "$S/7.mp3" 'https://raw.githubusercontent.com/bmagee88/cougar-cash/main/public/assets/sounds/samsung-spaceline-notification.mp3' 'https://site-ringtone.com/wp-content/uploads/2021/03/samsung-galaxy-spaceline-notification-sound.mp3'
          grab "$S/8.mp3" 'https://www.myinstants.com/media/sounds/whatsapp-notification-sound.mp3'
          grab "$S/9.mp3" 'https://unpkg.com/@zoom/meetingsdk@3.1.6/dist/lib/audio/incoming-msg-chime.mp3'

          chain(){ python3 - "$1" <<'PY'
          import sys
          p=float(sys.argv[1]); z=[]
          while p<.5: z+=['atempo=.5']; p/=.5
          while p>2: z+=['atempo=2']; p/=2
          z += [f'atempo={p:.12f}']
          print(','.join(z))
          PY
          }

          stretch(){
            src="$1"; out="$2"; id="$3"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
            p=$(python3 - "$d" <<'PY'
          import sys
          print(float(sys.argv[1])/213.0)
          PY
          )
            for n in 1 2 3 4 5 6 7 8; do
              c=$(chain "$p")
              ffmpeg -hide_banner -loglevel error -y -i "$src" -af "$c" -c:a pcm_s16le -map_metadata -1 "$T/$id.wav"
              a=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$T/$id.wav")
              if python3 - "$a" <<'PY'
          import sys
          raise SystemExit(0 if float(sys.argv[1])>=213 else 1)
          PY
              then break; fi
              p=$(python3 - "$p" "$a" <<'PY'
          import sys
          print(float(sys.argv[1])*(float(sys.argv[2])/213.0)*.99)
          PY
          )
            done
            a=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$T/$id.wav")
            python3 - "$a" <<'PY'
          import sys
          assert float(sys.argv[1])>=213
          PY
            sr=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$T/$id.wav")
            smp=$(python3 - "$sr" <<'PY'
          import sys
          print(int(sys.argv[1])*213)
          PY
          )
            ffmpeg -hide_banner -loglevel error -y -i "$T/$id.wav" -af "atrim=end_sample=$smp,asetpts=N/SR/TB" -c:a pcm_s16le -map_metadata -1 "$out"
            test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")" = '213.000000'
          }

          stretch "$S/1.mp3" "$O/▦.wav" 1
          stretch "$S/2.mp3" "$O/▦☎.wav" 2
          stretch "$S/3.mp3" "$O/✣.wav" 3
          stretch "$S/4.wav" "$O/✉.wav" 4
          stretch "$S/5.wav" "$O/⊞.wav" 5
          stretch "$S/6.mp3" "$O/🍎.wav" 6
          stretch "$S/7.mp3" "$O/◉.wav" 7
          stretch "$S/8.mp3" "$O/☏.wav" 8
          stretch "$S/9.mp3" "$O/⌾.wav" 9

          python3 - "$O/◌.png" <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import sys
          im=Image.new('RGB',(1500,1500),(9,9,11)); d=ImageDraw.Draw(im)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',190)
          syms=['▦','▦☎','✣','✉','⊞',None,'◉','☏','⌾']
          for i,s in enumerate(syms):
              r,c=divmod(i,3); x=c*500+250; y=r*500+250
              if s:
                  box=d.textbbox((0,0),s,font=font); w=box[2]-box[0]; h=box[3]-box[1]
                  d.text((x-w/2,y-h/2-box[1]),s,font=font,fill=(244,244,245))
              else:
                  # symbol only: an apple silhouette, drawn geometrically
                  d.ellipse((x-96,y-72,x+12,y+86),fill=(244,244,245)); d.ellipse((x-12,y-72,x+96,y+86),fill=(244,244,245))
                  d.polygon([(x-68,y+35),(x+68,y+35),(x+38,y+106),(x-38,y+106)],fill=(244,244,245))
                  d.ellipse((x+18,y-126,x+72,y-82),fill=(244,244,245))
              if c<2: d.line((500*(c+1),500*r,500*(c+1),500*(r+1)),fill=(39,39,42),width=2)
              if r<2: d.line((500*c,500*(r+1),500*(c+1),500*(r+1)),fill=(39,39,42),width=2)
          im.save(sys.argv[1],format='PNG',optimize=True)
          PY
          printf '%s\n' '▦.wav' '▦☎.wav' '✣.wav' '✉.wav' '⊞.wav' '🍎.wav' '◉.wav' '☏.wav' '⌾.wav' > "$O/◌.m3u"
          cd "$O"
          zip -9 -q "$A/◌.zip" '▦.wav' '▦☎.wav' '✣.wav' '✉.wav' '⊞.wav' '🍎.wav' '◉.wav' '☏.wav' '⌾.wav' '◌.png' '◌.m3u'
          unzip -l "$A/◌.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: x
          path: ${{ runner.temp }}/a/◌.zip
          if-no-files-found: error
          compression-level: 0
