name: Upload and deploy Corpus Note to HubSpot
on:
  push:
    branches:
      - codex/corpus-note-hubspot-card
  workflow_dispatch:
    inputs:
      brand_website:
        description: 'Organisation public website URL for Corpus branding'
        type: string
        required: false
        default: 'https://siloy.com/brand'
      brand_name:
        description: 'Organisation display name (optional)'
        type: string
        required: false
      brand_accent:
        description: 'Primary accent colour, for example #DAEAFF'
        type: string
        required: false
      brand_background:
        description: 'Banner background, for example #010103'
        type: string
        required: false
      brand_highlight:
        description: 'Internal-only badge colour, for example #FEF5AC'
        type: string
        required: false
      brand_logo_url:
        description: 'Optional HTTPS logo image hosted on the same domain as the website'
        type: string
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_ACCOUNT_ID: '149783010'
      DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure organisation brand
        env:
          CORPUS_BRAND_URL: ${{ inputs.brand_website || vars.CORPUS_BRAND_URL || 'https://siloy.com/brand' }}
          CORPUS_BRAND_NAME: ${{ inputs.brand_name || vars.CORPUS_BRAND_NAME || '' }}
          CORPUS_BRAND_ACCENT: ${{ inputs.brand_accent || vars.CORPUS_BRAND_ACCENT || '' }}
          CORPUS_BRAND_BACKGROUND: ${{ inputs.brand_background || vars.CORPUS_BRAND_BACKGROUND || '' }}
          CORPUS_BRAND_HIGHLIGHT: ${{ inputs.brand_highlight || vars.CORPUS_BRAND_HIGHLIGHT || '' }}
          CORPUS_BRAND_LOGO_URL: ${{ inputs.brand_logo_url || vars.CORPUS_BRAND_LOGO_URL || '' }}
        run: node scripts/configure-corpus-brand.mjs
      - name: Validate generated brand asset
        run: |
          node --input-type=module --check < src/app/cards/brand-banner.js
          grep -q 'data:image/svg+xml' src/app/cards/brand-banner.js
          grep -q 'Siloy UKI' src/app/cards/CorpusNoteCard.jsx
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Verify authorised HubSpot key
        run: |
          if [ -z "$DEFAULT_PERSONAL_ACCESS_KEY" ]; then
            echo "::error::Missing repository secret HUBSPOT_149783010_PERSONAL_ACCESS_KEY."
            exit 1
          fi
      - name: Bind Notes object ID to this customer portal
        env:
          HUBSPOT_ACCOUNT_ID: '149783010'
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
        run: |
          set -euo pipefail
          npm install -g @hubspot/cli@8.18.0 --no-audit --no-fund >/dev/null 2>&1
          hs custom-object list-schemas --use-env --no-color > "$RUNNER_TEMP/suki-schemas.txt"
          object_id="$(grep -F 'siloy_note' "$RUNNER_TEMP/suki-schemas.txt" | grep -oE '2-[0-9]+' | head -1)"
          if ! [[ "$object_id" =~ ^2-[0-9]+$ ]]; then
            echo "::error::Missing siloy_note CRM schema. Run the SUKI suite storage bootstrap first."
            exit 1
          fi
          echo "Binding Notes object type $object_id for SUKI 149783010"
          grep -rl '2-256491528' src/app | xargs -r sed -i "s/2-256491528/$object_id/g"
      - name: Upload project
        id: upload
        uses: HubSpot/hubspot-project-actions/project-upload@v1.1.0
        with:
          project_dir: './'
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Deploy build if not auto-deployed
        if: steps.upload.outputs.deploy_id == ''
        uses: HubSpot/hubspot-project-actions/project-deploy@v1.1.0
        with:
          deploy_latest_build: true
          project_dir: './'
          account_id: '149783010'
          personal_access_key: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      - name: Install Corpus Note private app into Siloy UKI Apps
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: '149783010'
        run: |
          npm install -g @hubspot/cli@8.18.0
          # HubSpot 8.18 prompts for an affirmative install confirmation.
          # Run under a PTY so the approved POC installation can complete in CI.
          for attempt in 1 2 3 4; do
            echo "=== Siloy Notes installation attempt $attempt ==="
            if printf 'y\n' | timeout 70s script -q -e -c "hs project install-app --use-env" /dev/null; then
              echo "Siloy Notes installation accepted"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "HubSpot app registration may still be propagating"
              sleep 25
            fi
          done
          echo "::error::Siloy Notes deployment completed, but installation was not accepted."
          exit 1
      - name: Verify HubSpot installation status
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: '149783010'
        run: |
          npm install -g @hubspot/cli@8.18.0
          echo "=== HubSpot build history ==="
          hs project list-builds --use-env --json || echo "::warning::Could not retrieve build history"
          echo "=== Corpus Note installation status ==="
          hs project app-install-status --use-env --json || echo "::warning::Could not retrieve app installation status"
