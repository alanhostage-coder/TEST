name: SUKI verify data model
on:
  push:
    branches: [codex/suki-suite-installer]
    paths: [.github/workflows/suki-legacy-cleanup.yml]
permissions:
  contents: read
concurrency:
  group: suki-149783010-native-suite
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active object schemas
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund @hubspot/local-dev-lib@latest >/dev/null
          node --input-type=module <<'NODE'
          import { getAccessToken } from '@hubspot/local-dev-lib/personalAccessKey';
          const auth = await getAccessToken(process.env.HUBSPOT_PERSONAL_ACCESS_KEY, undefined, 149783010);
          if (Number(auth.portalId) !== 149783010) throw Error('Wrong HubSpot portal');
          async function req(path, options={}) {
            const r = await fetch('https://api.hubapi.com' + path, {
              ...options, headers: { Authorization: 'Bearer ' + auth.accessToken, ...(options.headers||{}) }
            });
            if (!r.ok) throw Error(options.method + ' ' + path + ': HTTP ' + r.status + ' ' + (await r.text()).slice(0,1000));
            return r.status===204 ? null : await r.json();
          }
          const all=await req('/crm/v3/schemas');
          for (const id of ['2-256646328','2-256646413','2-256648074','2-256648076']) {
            const match=(all.results||[]).find(x=>x.objectTypeId===id);
            console.log(id,match ? 'ACTIVE '+JSON.stringify(match.labels) : 'NOT ACTIVE');
          }
          if ((all.results||[]).some(x=>['2-256646328','2-256646413'].includes(x.objectTypeId))) throw Error('Old schemas remain active');
          if (['2-256648074','2-256648076'].some(id=>!(all.results||[]).some(x=>x.objectTypeId===id))) throw Error('Suite schemas missing');
          NODE
