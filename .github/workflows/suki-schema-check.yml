name: Provision SUKI custom-object storage
on:
  push:
    branches: [codex/siloy-surface-portal-check]
    paths: [.github/workflows/suki-schema-check.yml, 'schemas/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUBSPOT_ACCOUNT_ID: '149783010'
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_149783010_PERSONAL_ACCESS_KEY || secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure SUKI only
        run: |
          test "$HUBSPOT_ACCOUNT_ID" = '149783010'
          test -n "$HUBSPOT_PERSONAL_ACCESS_KEY"
      - name: Install official HubSpot CLI
        run: npm install -g @hubspot/cli@8.18.0 --no-audit --no-fund
      - name: Inspect current SUKI object schemas
        run: hs custom-object list-schemas --use-env --no-color | tee "$RUNNER_TEMP/suki-schemas.txt"
      - name: Provision isolated Siloy Notes and Time object definitions
        run: |
          set -euo pipefail
          if grep -q 'siloy_note' "$RUNNER_TEMP/suki-schemas.txt"; then
            echo 'Siloy Notes schema already exists'
          else
            hs custom-object create-schema --path schemas/siloy-note.json --use-env --no-color
          fi
          if grep -q 'siloy_time_entry' "$RUNNER_TEMP/suki-schemas.txt"; then
            echo 'Siloy Time schema already exists'
          else
            hs custom-object create-schema --path schemas/siloy-time.json --use-env --no-color
          fi
      - name: Verify SUKI schema object IDs
        run: |
          set -euo pipefail
          hs custom-object list-schemas --use-env --no-color > "$RUNNER_TEMP/verified-schemas.txt"
          cat "$RUNNER_TEMP/verified-schemas.txt"
          grep -q 'siloy_note' "$RUNNER_TEMP/verified-schemas.txt" || { echo "::error::Siloy Notes schema missing"; exit 1; }
          grep -q 'siloy_time_entry' "$RUNNER_TEMP/verified-schemas.txt" || { echo "::error::Siloy Time schema missing"; exit 1; }
